syntax = "proto3";

package resname.invalid.literal;

import "google/api/resource.proto";

option go_package = "github.com/laenenai/protoc-gen-resname/testdata/golden/invalid/literal;literal";

// Rule: a literal is [a-z][a-zA-Z0-9]*.
message Book {
  option (google.api.resource) = {
    type: "library.example.com/Book"
    pattern: "Publishers/{publisher}/books/{book}"
    singular: "book"
    plural: "books"
  };

  string name = 1;
}
