// Scenario: the same resource as `single`, generated with a non-default
// parameter (strict_segments) so the emitted helpers differ.
syntax = "proto3";

package resname.strict_segments;

import "google/api/resource.proto";

option go_package = "github.com/laenenai/protoc-gen-resname/testdata/golden/strict_segments;strict_segments";

message Book {
  option (google.api.resource) = {
    type: "library.example.com/Book"
    pattern: "publishers/{publisher}/books/{book}"
    singular: "book"
    plural: "books"
  };

  string name = 1;
}
