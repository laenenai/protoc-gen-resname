// Scenario 2: a nested resource whose parent is a known resource, references
// on singular and repeated fields, and a wildcard reference (`type: "*"`).
syntax = "proto3";

package resname.nested;

import "google/api/resource.proto";

option go_package = "github.com/laenenai/protoc-gen-resname/testdata/golden/nested;nested";

message Publisher {
  option (google.api.resource) = {
    type: "library.example.com/Publisher"
    pattern: "publishers/{publisher}"
    singular: "publisher"
    plural: "publishers"
  };

  string name = 1;
}

message Book {
  option (google.api.resource) = {
    type: "library.example.com/Book"
    pattern: "publishers/{publisher}/books/{book}"
    singular: "book"
    plural: "books"
  };

  string name = 1;
  string title = 2;
}

message GetBookRequest {
  string name = 1 [(google.api.resource_reference).type = "library.example.com/Book"];
}

message BatchGetBooksRequest {
  string parent = 1 [(google.api.resource_reference).child_type = "library.example.com/Book"];
  repeated string names = 2 [(google.api.resource_reference).type = "library.example.com/Book"];
}

message MoveBookRequest {
  string name = 1 [(google.api.resource_reference).type = "library.example.com/Book"];
  string destination_name = 2 [(google.api.resource_reference).type = "library.example.com/Publisher"];
  string anything_name = 3 [(google.api.resource_reference).type = "*"];
}
