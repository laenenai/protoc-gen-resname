// Scenario 6: child_type references with one possible parent (Magazine) and
// with several (Book).
syntax = "proto3";

package resname.childtype;

import "google/api/resource.proto";

option go_package = "github.com/laenenai/protoc-gen-resname/testdata/golden/childtype;childtype";

message Publisher {
  option (google.api.resource) = {
    type: "library.example.com/Publisher"
    pattern: "publishers/{publisher}"
    singular: "publisher"
    plural: "publishers"
  };

  string name = 1;
}

message Shelf {
  option (google.api.resource) = {
    type: "library.example.com/Shelf"
    pattern: "shelves/{shelf}"
    singular: "shelf"
    plural: "shelves"
  };

  string name = 1;
}

message Magazine {
  option (google.api.resource) = {
    type: "library.example.com/Magazine"
    pattern: "publishers/{publisher}/magazines/{magazine}"
    singular: "magazine"
    plural: "magazines"
  };

  string name = 1;
}

message Book {
  option (google.api.resource) = {
    type: "library.example.com/Book"
    pattern: "publishers/{publisher}/books/{book}"
    pattern: "shelves/{shelf}/books/{book}"
    singular: "book"
    plural: "books"
  };

  string name = 1;
}

message ListMagazinesRequest {
  string parent = 1 [(google.api.resource_reference).child_type = "library.example.com/Magazine"];
}

message ListBooksRequest {
  string parent = 1 [(google.api.resource_reference).child_type = "library.example.com/Book"];
}
