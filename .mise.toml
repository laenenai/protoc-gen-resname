# Toolchain pinned for reproducible build, test and golden checks across
# devs and CI. Run `mise install` on a fresh checkout, then `mise run ci`.

[tools]
go = "1.25.6"
buf = "1.65.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:honnef.co/go/tools/cmd/staticcheck" = "2025.1.1"

[env]
GOWORK = "off"

# The committed golden output under testdata/golden is a set of real Go
# packages; the go tool skips `testdata` in `./...`, so every task names
# that tree explicitly.

[tasks.build]
description = "Build protoc-gen-resname into ./bin"
run = "go build -o bin/protoc-gen-resname ./cmd/protoc-gen-resname"

[tasks.test]
description = "Go tests: golden scenarios, negative cases, determinism, and the table tests on the generated packages"
run = "go test ./... ./testdata/golden/..."

[tasks.vet]
description = "go vet, including the committed golden packages"
run = "go vet ./... ./testdata/golden/..."

[tasks.lint]
description = "gofmt and staticcheck"
run = """
set -e
unformatted="$(gofmt -l $(git ls-files '*.go'))"
if [ -n "$unformatted" ]; then echo "gofmt: $unformatted"; exit 1; fi
staticcheck ./... ./testdata/golden/...
"""

[tasks.fuzz]
description = "Run FuzzParseBookName on the generated package for 60 s"
run = "go test ./testdata/golden/nested -run '^$' -fuzz '^FuzzParseBookName$' -fuzztime 60s"

[tasks.golden]
description = "Rebuild the buf image, the protoc-gen-go companions and the plugin's golden files"
run = """
set -e
cd testdata/proto
buf lint
buf build -o image.binpb
buf generate --path single --path nested --path multi --path singleton --path external \
  --path crosspkg --path childtype --path refids_names --path refids_all \
  --path strict_segments --path nowildcards --path warn
cd ../..
go test ./internal/plugin -run '^TestGolden$' -update
"""

[tasks.ci]
description = "Everything CI runs"
depends = ["build", "vet", "lint", "test"]
